PACKAGE_NAME="linuwu_sense"
# Keep in sync with DRIVER_VERSION in src/linuwu_sense.c.
# `make install` rewrites this line from DRIVER_VERSION when it copies the
# sources to /usr/src, so the two can never drift for installed copies.
PACKAGE_VERSION="25.701"

# Rebuild automatically for every newly installed kernel.
AUTOINSTALL="yes"

MAKE[0]="make KVER=${kernelver}"

BUILT_MODULE_NAME[0]="linuwu_sense"
BUILT_MODULE_LOCATION[0]="src/"
# Distros with their own DKMS layout (Debian/Ubuntu, Arch, Fedora, SUSE)
# override this; elsewhere it keeps the module apart from legacy copies.
DEST_MODULE_LOCATION[0]="/updates/dkms"
